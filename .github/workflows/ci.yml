name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          python -m pytest

      - name: End-to-end calculation (1,000 digits)
        run: |
          python pi_project_v4.py --digits 1000 --output /tmp/pi_1000_calculated.txt
          test "$(wc -c < /tmp/pi_1000_calculated.txt)" -eq 1002

      - name: End-to-end verification against committed reference
        run: |
          python verify.py \
            --calculated /tmp/pi_1000_calculated.txt \
            --reference tests/fixtures/pi_1000_reference.txt
