name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run test suite
        run: |
          python -m pytest

      - name: Verify committed reference fixture integrity
        run: |
          EXPECTED="823a2e34f63c5d5f30a27733976df5a1ab57feaab505f40d95d3dd3fefa425cc"
          ACTUAL="$(sha256sum tests/fixtures/pi_1000_reference.txt | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Reference fixture SHA-256 mismatch!"
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi
          echo "Reference fixture SHA-256 verified: $ACTUAL"

      - name: End-to-end calculate + verify against committed reference
        run: |
          piproject calculate --digits 1000 --output /tmp/pi_1000_calculated.txt
          # Verify the calculated output against the INDEPENDENT committed reference.
          # This is NOT self-verification: the reference is a separate file with
          # documented provenance (see tests/fixtures/pi_1000_reference.provenance.json).
          piproject verify \
            --input /tmp/pi_1000_calculated.txt \
            --reference tests/fixtures/pi_1000_reference.txt

      - name: Benchmark (1,000 digits)
        run: |
          piproject benchmark --digits 1000 --repeats 3
