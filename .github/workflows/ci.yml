name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run test suite
        run: |
          python -m pytest

      - name: Benchmark (1,000 digits)
        run: |
          piproject benchmark --digits 1000 --repeats 3

      - name: End-to-end calculate + verify (10,000 digits)
        run: |
          piproject calculate --digits 10000 --output /tmp/pi_10000.txt
          piproject verify --input /tmp/pi_10000.txt --reference /tmp/pi_10000.txt
